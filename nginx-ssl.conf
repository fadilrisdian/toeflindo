server {
    listen 8888 ssl;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    client_max_body_size 50M;

    # Use Docker's internal DNS.
    # Variables in proxy_pass force nginx to re-resolve on every request
    # instead of caching the IP at startup — prevents 502 after container restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Analyze — bypass Next.js proxy (ClientDisconnect fix)
    # EXACT match so it doesn't capture /analyzer-data or /analyzer/history
    location = /api/speaking/analyze {
        set $backend toefl-api:8000;
        proxy_pass http://$backend/api/speaking/analyze;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }

    # Upload-analyze — bypass Next.js proxy (standalone audio analysis)
    location /api/speaking/upload-analyze {
        set $backend toefl-api:8000;
        proxy_pass http://$backend/api/speaking/upload-analyze;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 120s;
        client_max_body_size 50M;
    }

    # Audio — stream directly, no buffering to disk
    location /api/speaking/audio {
        set $frontend toefl-frontend:3000;
        proxy_pass http://$frontend/api/speaking/audio;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    # User recordings — direct to FastAPI (auth required, served as webm)
    location /api/speaking/recording {
        set $backend toefl-api:8000;
        proxy_pass http://$backend/api/speaking/recording;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    # Everything else — Next.js frontend
    location / {
        set $frontend toefl-frontend:3000;
        proxy_pass http://$frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
