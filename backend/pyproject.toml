[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toefl-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.2",
    "httpx==0.28.1",
    "python-multipart==0.0.20",
    "joserfc==0.12.0",
    "passlib[bcrypt]==1.7.4",
    "litellm==1.91.1",
    "faster-whisper==1.2.1",
    "librosa==0.10.2",
    "numpy==1.26.4",
    "soundfile==0.12.1",
    # NLP feature extraction for writing scoring
    "spacy==3.8.7",
    "wordfreq==3.1.1",
    "symspellpy==6.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
